name: CI

on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: codics-ci-test-jwt-secret-minimum-32-characters
      DATABASE_URL: postgresql://codics:codics@127.0.0.1:5432/codics?schema=public
      DIRECT_URL: postgresql://codics:codics@127.0.0.1:5432/codics?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test
