name: CI

on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests
        env:
          NODE_ENV: test
          JWT_SECRET: codics-ci-test-jwt-secret-minimum-32-characters
        run: npm test
