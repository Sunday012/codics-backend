name: CI

on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codics
          POSTGRES_PASSWORD: codics
          POSTGRES_DB: codics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run e2e tests
        env:
          NODE_ENV: test
          JWT_SECRET: codics-ci-test-jwt-secret-minimum-32-characters
          DATABASE_URL: postgresql://codics:codics@127.0.0.1:5432/codics?schema=public
          DIRECT_URL: postgresql://codics:codics@127.0.0.1:5432/codics?schema=public
          TEST_DATABASE_URL: postgresql://codics:codics@127.0.0.1:5432/codics?schema=public
        run: npm run test:e2e
