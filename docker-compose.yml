services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codics
      POSTGRES_USER: codics
      POSTGRES_PASSWORD: codics
    ports:
      - "5433:5432"
    volumes:
      - codics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codics -d codics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codics_postgres_data:
