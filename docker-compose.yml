services:
  postgres:
    image: postgres:16-alpine
    container_name: codics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codics
      POSTGRES_PASSWORD: codics
      POSTGRES_DB: codics
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  postgres_data:
