services:
  - type: web
    name: codics-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel deployment URL (e.g. https://your-project.vercel.app)
      - key: FRONTEND_URL
        sync: false # Usually the same URL as CORS_ORIGIN
      - key: DB_POOL_MAX
        value: 10
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: WEB_PUSH_ENABLED
        value: "false"
