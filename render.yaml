services:
  - type: web
    name: codics-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel deployment URL (e.g. https://your-project.vercel.app)
      - key: DB_POOL_MAX
        value: 10
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: WEB_PUSH_ENABLED
        value: "false"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
